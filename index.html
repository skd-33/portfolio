<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sourabh Kumar Dubey | Portfolio</title>
<meta name="description" content="Computer Science undergraduate and competitive programmer. 700+ LeetCode problems, Codeforces Pupil. Projects in network inspection, computer vision and AI tooling.">
<style>
:root{--bg:#15171c;--bar:#1e2127;--fg:#d4d8de;--dim:#7d8590;--prompt:#7fd1ae;--path:#6cb6ff;--accent:#e8b75d;--err:#f08a8a;--line:#2b2f37;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-t="dark"]){--bg:#f6f4ef;--bar:#e9e6de;--fg:#25282d;--dim:#6b7078;--prompt:#1d7a55;--path:#1a5fb4;--accent:#9a6700;--err:#b42318;--line:#d8d4c8;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column}
a{color:var(--path);text-underline-offset:3px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--bar);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
header i{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
header span{margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#term{flex:1;overflow-y:auto;padding:18px 16px 12px;max-width:920px;width:100%;margin:0 auto}
.cmd{margin-top:14px}
.ps{color:var(--prompt)}.pa{color:var(--path)}
.out{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.out p{margin:0 0 8px}
.dim{color:var(--dim)}.ac{color:var(--accent)}.er{color:var(--err)}
.row{display:grid;grid-template-columns:11ch 1fr;gap:0 12px}
.row b{color:var(--accent);font-weight:400}
.proj{margin:0 0 12px;padding-left:12px;border-left:2px solid var(--line)}
.proj h3{margin:0;font-size:15px;font-weight:700;color:var(--fg)}
.proj .t{color:var(--dim);font-size:13px}
.proj ul{margin:4px 0 0;padding-left:18px}
.proj li{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-top:1px solid var(--line);background:var(--bar)}
.chips button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:3px 10px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
form{display:flex;gap:8px;margin-top:14px;align-items:center}
form label{white-space:nowrap}
#in{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;caret-color:var(--accent);padding:0}
#in:focus{outline:0}
.sr{position:absolute;left:-9999px}
.cur{display:inline-block;width:.6ch;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
@media(max-width:560px){body{font-size:14px}.row{grid-template-columns:1fr}.row b{margin-top:6px}#in{font-size:16px}}
</style>
</head>
<body>
<header><i></i><i></i><i></i><span>sourabh@portfolio: ~</span></header>
<main id="term" aria-live="polite">
  <noscript>
    <h1>Sourabh Kumar Dubey</h1>
    <p>Computer Science undergraduate and competitive programmer in Bengaluru.</p>
    <p><a href="https://github.com/skd-33">GitHub</a> · <a href="https://leetcode.com/u/skd-33">LeetCode</a> · <a href="https://codeforces.com/profile/sourabhkumardubey200">Codeforces</a> · <a href="mailto:sourabhkumardubey200@gmail.com">Email</a></p>
  </noscript>
  <div id="log"></div>
  <form id="f" autocomplete="off"><label for="in"><span class="ps">sourabh</span><span class="dim">@</span><span class="pa">portfolio</span><span class="dim">:~$</span></label><input id="in" spellcheck="false" autocapitalize="none" aria-label="Type a command, for example help"></form>
</main>
<nav class="chips" aria-label="Commands" id="chips"></nav>

<script>
const $=s=>document.querySelector(s),log=$("#log"),inp=$("#in"),term=$("#term");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const L=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${t||u.replace(/^https?:\/\/|^mailto:/,"")}</a>`;
const row=(k,v)=>`<div class="row"><b>${k}</b><span>${v}</span></div>`;

const proj=(n,t,l,ls)=>`<div class="proj"><h3>${n}</h3><div class="t">${t}${l?" · "+l:""}</div><ul>${ls.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;

const C={
help:()=>`<p>Available commands:</p>`+[["about","who I am"],["projects","things I've built"],["skills","languages, algorithms, tools"],["cp","competitive programming stats"],["education","where I study"],["resume","download my resume (PDF)"],["contact","email and profiles"],["clear","clear the screen"]].map(([a,b])=>row(a,b)).join("")+`<p class="dim" style="margin-top:8px">Tab completes, ↑ ↓ browse history.</p>`,
about:()=>`<p><span class="ac">Sourabh Kumar Dubey</span> — Computer Science undergraduate and competitive programmer in Bengaluru.</p><p>I solve algorithm problems daily (700+ on LeetCode) and build projects that read network packets, detect obstacles for visually impaired users, and run local LLMs.</p><p>Looking for a software engineering internship.</p>`,
projects:()=>proj("BuildFolio","JavaScript, React, FastAPI, Ollama",L("https://github.com/skd-33/BuildFolio","source"),["AI workspace to build, track, understand and showcase technical projects.","React/Vite frontend, FastAPI + SQLAlchemy backend, local LLM (gemma3 via Ollama).","Made for the DEV Hacktoberfest Weekend Challenge."])
+proj("Deep Packet Inspection System","C++, Python","",["Parses packet headers and traffic data to inspect and classify network activity.","Built over multiple versions using networking and cybersecurity fundamentals."])
+proj("Obstacle Detection for Visually Impaired Users","Python, PyTorch, YOLO, Ultralytics","",["Real-time object detection from a smartphone camera.","Focused on timely, useful obstacle information."])
+proj("Chess Square Guessing Game","HTML, JavaScript",L("https://github.com/skd-33/chess_square_guess_game","source"),["Interactive game for learning chessboard squares."])
+`<p class="dim">More at ${L("https://github.com/skd-33?tab=repositories","github.com/skd-33")}</p>`,
skills:()=>row("languages","C, C++, Python, JavaScript")+row("core","DSA, Competitive Programming, Computer Networks")+row("algorithms","Graphs, DP (2D, bitmask, DAG), Greedy, Backtracking, Sliding Window, Binary Search, Prefix Sums, Trees, Fenwick Tree, Segment Tree, SCC/Tarjan")+row("ai/vision","PyTorch, YOLO, Ultralytics, Ollama")+row("web/tools","React, Vite, FastAPI, Three.js, Git, GitHub"),
cp:()=>row("leetcode","700+ solved, Knight badge · "+L("https://leetcode.com/u/skd-33","skd-33"))+row("codeforces","Pupil, peak 1350+ · "+L("https://codeforces.com/profile/sourabhkumardubey200","sourabhkumardubey200"))+row("techniques","Tarjan's SCC, Fenwick and Segment Trees, Manacher, Booth, sieve, inclusion–exclusion")+row("method","Brute-force stress testing before finalizing a solution")+row("aws","3rd place in an AWS Cloud Quest tournament (1 of 6 finishers)"),
education:()=>row("college","Bangalore Institute of Technology, Bengaluru")+row("degree","B.E. Computer Science &amp; Engineering")+row("years","2025 – present")+row("cgpa","8.8"),
resume:()=>`<p>${L("Sourabh_Kumar_Dubey_Resume.pdf","Download Sourabh_Kumar_Dubey_Resume.pdf")}</p>`,
contact:()=>row("email",L("mailto:sourabhkumardubey200@gmail.com"))+row("github",L("https://github.com/skd-33"))+row("leetcode",L("https://leetcode.com/u/skd-33"))+row("codeforces",L("https://codeforces.com/profile/sourabhkumardubey200"))+row("dev.to",L("https://dev.to/ab_33"))+row("x",L("https://x.com/skd_33")),
whoami:()=>"sourabh",
ls:()=>`<span class="pa">about  projects  skills  cp  education  resume  contact</span>`,
"sudo hire-me":()=>`<span class="ac">Permission granted.</span> Email ${L("mailto:sourabhkumardubey200@gmail.com")} to continue.`,
theme:()=>{const d=document.documentElement;d.dataset.t=d.dataset.t==="dark"?"light":"dark";return `<span class="dim">theme: ${d.dataset.t}</span>`}
};
const names=Object.keys(C).filter(k=>!["whoami","ls","sudo hire-me","theme"].includes(k)).concat("clear");
const hist=[];let hi=0;

function add(cmd,instant){
  const d=document.createElement("div");d.className="cmd";
  d.innerHTML=`<div><span class="ps">sourabh</span><span class="dim">@</span><span class="pa">portfolio</span><span class="dim">:~$</span> <span class="c"></span></div><div class="out"></div>`;
  log.appendChild(d);return d;
}
function run(raw){
  const c=raw.trim().replace(/\s+/g," ").toLowerCase();if(!c)return;
  hist.push(c);hi=hist.length;
  if(c==="clear"){log.innerHTML="";return}
  const d=add();d.querySelector(".c").textContent=raw.trim();
  const o=d.querySelector(".out");
  o.innerHTML=C[c]?C[c]():`<span class="er">command not found: ${c.replace(/[<>&]/g,"")}</span>. Type <span class="ac">help</span>.`;
  term.scrollTop=term.scrollHeight;
}
function type(cmd){return new Promise(res=>{
  const d=add(),s=d.querySelector(".c"),o=d.querySelector(".out");
  const done=()=>{o.innerHTML=C[cmd]();res()};
  if(reduce){s.textContent=cmd;return done()}
  let i=0;const t=setInterval(()=>{s.textContent=cmd.slice(0,++i);if(i>=cmd.length){clearInterval(t);setTimeout(done,120)}},45);
})}
$("#f").addEventListener("submit",e=>{e.preventDefault();run(inp.value);inp.value="";term.scrollTop=term.scrollHeight});
inp.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"&&hi>0){e.preventDefault();inp.value=hist[--hi]}
  else if(e.key==="ArrowDown"){e.preventDefault();inp.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,"")}
  else if(e.key==="Tab"){e.preventDefault();const m=names.filter(n=>n.startsWith(inp.value.toLowerCase()));if(m.length===1)inp.value=m[0]}
  else if(e.key==="l"&&e.ctrlKey){e.preventDefault();log.innerHTML=""}
});
$("#chips").innerHTML=["help","about","projects","skills","cp","education","resume","contact","clear"].map(n=>`<button type="button">${n}</button>`).join("");
$("#chips").addEventListener("click",e=>{if(e.target.tagName==="BUTTON"){run(e.target.textContent);inp.focus({preventScroll:true})}});
term.addEventListener("click",()=>{if(!getSelection().toString())inp.focus({preventScroll:true})});
(async()=>{for(const c of["whoami","about","projects"])await type(c);log.insertAdjacentHTML("beforeend",`<div class="out dim" style="margin-top:14px">Type <span class="ac">help</span> or tap a command below.</div>`);term.scrollTop=0})();
</script>
</body>
</html>
