<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sourabh Kumar Dubey | Portfolio</title>
<meta name="description" content="Computer Science undergraduate and competitive programmer. 700+ LeetCode problems, Codeforces Pupil. Projects in network inspection, computer vision and AI tooling.">
<style>
:root{--bg:#15171c;--bar:#1e2127;--fg:#d4d8de;--dim:#7d8590;--prompt:#7fd1ae;--path:#6cb6ff;--accent:#e8b75d;--err:#f08a8a;--line:#2b2f37;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-t="dark"]){--bg:#f6f4ef;--bar:#e9e6de;--fg:#25282d;--dim:#6b7078;--prompt:#1d7a55;--path:#1a5fb4;--accent:#9a6700;--err:#b42318;--line:#d8d4c8;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;display:flex;flex-direction:column}
a{color:var(--path);text-underline-offset:3px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--bar);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
header i{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
header span{margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#term{flex:1;overflow-y:auto;padding:18px 16px 12px;max-width:920px;width:100%;margin:0 auto}
.cmd{margin-top:14px}
.ps{color:var(--prompt)}.pa{color:var(--path)}
.out{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.out p{margin:0 0 8px}
.dim{color:var(--dim)}.ac{color:var(--accent)}.er{color:var(--err)}
.row{display:grid;grid-template-columns:11ch 1fr;gap:0 12px}
.row b{color:var(--accent);font-weight:400}
.proj{margin:0 0 12px;padding-left:12px;border-left:2px solid var(--line)}
.proj h3{margin:0;font-size:15px;font-weight:700;color:var(--fg)}
.proj .t{color:var(--dim);font-size:13px}
.proj ul{margin:4px 0 0;padding-left:18px}
.proj li{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-top:1px solid var(--line);background:var(--bar)}
.chips button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:3px 10px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
form{display:flex;gap:8px;margin-top:14px;align-items:center}
form label{white-space:nowrap}
#in{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;caret-color:var(--accent);padding:0}
#in:focus{outline:0}
.sr{position:absolute;left:-9999px}
.cur{display:inline-block;width:.6ch;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
/*nf*/.nf{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}.nf pre{margin:0;color:var(--accent);line-height:1.25}
.grp{color:var(--dim);margin:10px 0 2px}
body.haunted{--bg:#0e0a14;--bar:#17101f;--prompt:#b79cff;--accent:#ff7a90;--line:#2a1f38}
.ghost{color:#b79cff;font-style:italic;margin-top:4px}
.ghost.w{animation:fl 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:1}45%{opacity:.35}55%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.ghost.w{animation:none}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
@media(max-width:560px){body{font-size:14px}.row{grid-template-columns:1fr}.row b{margin-top:6px}#in{font-size:16px}}
</style>
</head>
<body>
<header><i></i><i></i><i></i><span id="title"></span></header>
<main id="term" aria-live="polite">
  <noscript>
    <h1>Sourabh Kumar Dubey</h1>
    <p>Computer Science undergraduate and Competitive programmer.</p>
    <p><a href="https://github.com/skd-33">GitHub</a> · <a href="https://leetcode.com/u/skd-33">LeetCode</a> · <a href="https://codeforces.com/profile/sourabhkumardubey200">Codeforces</a> · <a href="mailto:sourabhkumardubey200@gmail.com">Email</a></p>
  </noscript>
  <div id="log"></div>
  <form id="f" autocomplete="off"><label for="in" id="label"></label><input id="in" spellcheck="false" autocapitalize="none" aria-label="Type a command, for example help"></form>
</main>
<nav class="chips" aria-label="Commands" id="chips"></nav>

<script>
/* ===== EDIT ONLY THIS BLOCK to make the site yours ===== */
const CONFIG={
  name:"Sourabh Kumar Dubey",
  user:"sourabh", host:"portfolio",
  tagline:"CS undergraduate and competitive programmer in Bengaluru.",
  facts:{role:"CS undergrad, competitive programmer",location:"Bengaluru, India",college:"Bangalore Institute of Technology",leetcode:"700+ solved, Knight",codeforces:"Pupil, peak 1350+",languages:"C, C++, Python, JavaScript",shell:"haunt (gemma3:1b)",status:"open to internships"},
  email:"sourabhkumardubey200@gmail.com",
  resumePdf:"Sourabh_Kumar_Dubey_Resume.pdf",          // put the PDF next to index.html, or set to "" to hide the command
  links:{github:"https://github.com/skd-33",leetcode:"https://leetcode.com/u/skd-33",codeforces:"https://codeforces.com/profile/sourabhkumardubey200","dev.to":"https://dev.to/ab_33",x:"https://x.com/skd_33"},
  sections:[
    {cmd:"about",desc:"who I am",type:"text",data:[
      "Computer Science undergraduate and competitive programmer in Bengaluru.",
      "I solve algorithm problems daily (700+ on LeetCode) and build projects that read network packets, detect obstacles for visually impaired users, and run local LLMs.",
      "Looking for a software engineering internship."]},
    {cmd:"projects",desc:"things I've built",type:"projects",data:[
      {name:"BuildFolio",tech:"JavaScript, React, FastAPI, Ollama",link:"https://github.com/skd-33/BuildFolio",points:["AI workspace to build, track, understand and showcase technical projects.","React/Vite frontend, FastAPI + SQLAlchemy backend, local LLM (gemma3 via Ollama)."]},
      {name:"Haunted Terminal",tech:"Python, Ollama, gemma3",link:"https://github.com/skd-33/haunted-terminal",points:["Shell wrapper where a local open-weight model whispers eerie comments on every command.","Try it here: type haunt."]},
      {name:"Look Up",tech:"Python, Skyfield, Ollama",link:"https://github.com/skd-33/look-up",points:["Offline stargazing companion that nudges you outside to look at what's up tonight, with a local model for the messages."]},
      {name:"Song Saver",tech:"Python, open-source AI",link:"https://github.com/skd-33/song-saver",points:["Share a reel or short from your phone and get the song later, processed in the background."]},
      {name:"Adventure Game",tech:"Python, GitHub Copilot",link:"https://github.com/skd-33/copilot-adventure-game",points:["Command-line adventure game built with GitHub Copilot."]},
      {name:"Deep Packet Inspection System",tech:"C++, Python",points:["Parses packet headers and traffic data to inspect and classify network activity."]},
      {name:"Obstacle Detection for Visually Impaired Users",tech:"Python, PyTorch, YOLO",points:["Real-time object detection from a smartphone camera."]},
      {name:"Chess Square Guessing Game",tech:"HTML, JavaScript",link:"https://github.com/skd-33/chess_square_guess_game",points:["Interactive game for learning chessboard squares."]}]},
    {cmd:"achievements",desc:"badges, ranks and posts",type:"log",data:[
      {d:"2026",t:"LeetCode Knight badge, 700+ problems solved"},
      {d:"2026",t:"Codeforces Pupil, peak rating 1350+"},
      {d:"2026",t:"3rd place in an AWS Cloud Quest tournament (1 of 6 finishers)"},
      {d:"2026",t:"GitHub achievements: Pull Shark, Quickdraw"},
      {d:"Nov 2026",t:"Published Haunted Terminal for DEV Hacktoberfest Week 4 https://dev.to/ab_33/haunted-terminal-a-ghost-in-my-shell-powered-by-local-gemma-44gf"},
      {d:"Oct 2026",t:"Entered the DEV Hacktoberfest open-source AI challenges: Look Up, Song Saver, DocsPulse https://dev.to/ab_33"}]},
    {cmd:"skills",desc:"languages, algorithms, tools",type:"rows",data:{languages:"C, C++, Python, JavaScript",core:"DSA, Competitive Programming, Computer Networks",algorithms:"Graphs, DP (2D, bitmask, DAG), Greedy, Sliding Window, Binary Search, Trees, Fenwick, Segment Tree, Tarjan SCC","ai/vision":"PyTorch, YOLO, Ultralytics, Ollama","web/tools":"React, Vite, FastAPI, Three.js, Git"}},
    {cmd:"cp",desc:"competitive programming",type:"rows",data:{leetcode:"700+ solved, Knight badge https://leetcode.com/u/skd-33",codeforces:"Pupil, peak 1350+ https://codeforces.com/profile/sourabhkumardubey200",method:"Brute-force stress testing before finalizing a solution",aws:"3rd place in an AWS Cloud Quest tournament"}},
    {cmd:"education",desc:"where I study",type:"rows",data:{college:"Bangalore Institute of Technology, Bengaluru",degree:"B.E. Computer Science & Engineering",years:"2025 - present",cgpa:"8.8"}}
  ]
};
/* ===== end of config ===== */

const $=s=>document.querySelector(s),log=$("#log"),inp=$("#in"),term=$("#term");
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const lk=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${esc(t||u.replace(/^https?:\/\/|^mailto:/,""))}</a>`;
const auto=t=>esc(t).replace(/(https?:\/\/[^\s]+)/g,u=>lk(u));
const row=(k,v)=>`<div class="row"><b>${esc(k)}</b><span>${auto(v)}</span></div>`;
const proj=p=>`<div class="proj"><h3>${esc(p.name)}</h3><div class="t">${esc(p.tech||"")}${p.link?" · "+lk(p.link,"source"):""}</div><ul>${(p.points||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
const R={text:d=>d.map(x=>`<p>${auto(x)}</p>`).join(""),rows:d=>Object.entries(d).map(([k,v])=>row(k,v)).join(""),log:d=>d.map(x=>row(x.d,x.t)).join(""),
projects:(d,a)=>{const q=(a||"").toLowerCase();const l=q?d.filter(p=>JSON.stringify(p).toLowerCase().includes(q)):d;return (l.length?l.map(proj).join(""):`<span class="er">no project matches "${esc(a)}"</span>`)+`<p class="dim">Filter with: projects &lt;word&gt;, for example projects python</p>`}};

const C={},desc={};
CONFIG.sections.forEach(s=>{C[s.cmd]=a=>R[s.type](s.data,a);desc[s.cmd]=s.desc});
if(CONFIG.resumePdf){C.resume=()=>`<p>${lk(CONFIG.resumePdf,"Download "+CONFIG.resumePdf)}</p>`;desc.resume="download my resume (PDF)"}
C.contact = () =>
  row("email", CONFIG.email) +
  Object.entries(CONFIG.links)
    .map(([k, v]) => row(k, v))
    .join("");
desc.contact = "email and profiles";
C.haunt=()=>{haunted=!haunted;document.body.classList.toggle("haunted",haunted);return haunted?`<span class="ac">The terminal is haunted.</span> Run any command. Type <span class="ac">haunt</span> again to exorcise.`:`<span class="dim">The ghost has left.</span>`};desc.haunt="let a ghost haunt every command (toggle)";
C.theme=()=>{const d=document.documentElement;d.dataset.t=d.dataset.t==="dark"?"light":"dark";return `<span class="dim">theme: ${d.dataset.t}</span>`};
C.whoami=()=>esc(CONFIG.user);
C.neofetch=()=>`<div class="nf"><pre>  ┌────────┐
  │ &gt;_ ░░░ │
  │ ░░░░░░ │
  └──┬──┬──┘
     └──┘</pre><div>${row(CONFIG.user+"@"+CONFIG.host,"")}${Object.entries(CONFIG.facts).map(([k,v])=>row(k,v)).join("")}</div></div>`;desc.neofetch="quick profile card";
C.history=()=>hist.length?hist.map((h,i)=>`${String(i+1).padStart(3)}  ${esc(h)}`).join("\n"):"<span class=dim>no history yet</span>";
C.date=()=>new Date().toString();
C.echo=a=>esc(a||"");
C.ls=()=>`<span class="pa">${Object.keys(desc).join("  ")}</span>`;
const GROUPS={"about me":["about","neofetch","education","skills"],"work":["projects","achievements","cp","resume"],"reach me":["contact"],"fun":["haunt"]};
C.help=()=>{const seen=new Set();let h="";for(const[g,l]of Object.entries(GROUPS)){const k=l.filter(x=>desc[x]);if(!k.length)continue;k.forEach(x=>seen.add(x));h+=`<div class="grp">${g}</div>`+k.map(x=>row(x,desc[x])).join("")}
const rest=Object.keys(desc).filter(x=>!seen.has(x));if(rest.length)h+=`<div class="grp">other</div>`+rest.map(x=>row(x,desc[x])).join("");
return h+`<div class="grp">terminal</div>`+row("clear","clear the screen")+row("history","commands you ran")+row("theme","switch light or dark")+`<p class="dim" style="margin-top:8px">Tab completes, ↑ ↓ browse history.</p>`};
C["sudo hire-me"]=()=>`<span class="ac">Permission granted.</span> Email ${lk("mailto:"+CONFIG.email)} to continue.`;
const names=["help",...Object.keys(desc),"history","clear"];
const hist=[];let hi=0;let haunted=false;
const GH=["I was here before your first commit.","Something in that output is watching you.","Every file remembers who deleted it.","The logs go back further than you think.","Run it again. I dare you.","Your cursor blinks. So does something behind it."];
async function whisper(c,o){
  const g=document.createElement("div");g.className="ghost w";o.appendChild(g);
  let t=GH[Math.floor(Math.random()*GH.length)],who="offline ghost";
  try{const ac=new AbortController();setTimeout(()=>ac.abort(),4000);
    const r=await fetch("http://localhost:11434/api/generate",{method:"POST",signal:ac.signal,body:JSON.stringify({model:"gemma3:1b",stream:false,options:{num_predict:40,temperature:.9},prompt:"You are a ghost haunting a terminal. Reply with ONE eerie sentence, max 18 words, about the command: "+c})});
    const j=await r.json();if(j.response){t=j.response.trim().split("\n")[0];who="gemma3:1b, local"}}catch(e){}
  g.textContent="~ "+t+"  ["+who+"]";term.scrollTop=term.scrollHeight;
}
const PS=`<span class="ps">${esc(CONFIG.user)}</span><span class="dim">@</span><span class="pa">${esc(CONFIG.host)}</span><span class="dim">:~$</span>`;
function add(){const d=document.createElement("div");d.className="cmd";d.innerHTML=`<div>${PS} <span class="c"></span></div><div class="out"></div>`;log.appendChild(d);return d}
function run(raw){
  const c=raw.trim().replace(/\s+/g," ").toLowerCase();if(!c)return;
  hist.push(c);hi=hist.length;
  if(c==="clear"){log.innerHTML="";return}
  const d=add();d.querySelector(".c").textContent=raw.trim();
  const o=d.querySelector(".out");
  let fn=C[c],a="";if(!fn){const i=c.indexOf(" ");if(i>0&&C[c.slice(0,i)]){fn=C[c.slice(0,i)];a=raw.trim().slice(i+1)}}
  o.innerHTML=fn?fn(a):`<span class="er">command not found: ${esc(c)}</span>. Type <span class="ac">help</span>.`;
  if(haunted&&c!=="haunt")whisper(c,o);
  term.scrollTop=term.scrollHeight;
}
document.title=CONFIG.name+" | Portfolio";
$("#title").textContent=CONFIG.user+"@"+CONFIG.host+": ~";
$("#label").innerHTML=PS;
$("#f").addEventListener("submit",e=>{e.preventDefault();run(inp.value);inp.value="";term.scrollTop=term.scrollHeight});
inp.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"&&hi>0){e.preventDefault();inp.value=hist[--hi]}
  else if(e.key==="ArrowDown"){e.preventDefault();inp.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,"")}
  else if(e.key==="Tab"){e.preventDefault();const m=names.filter(n=>n.startsWith(inp.value.toLowerCase()));if(m.length===1)inp.value=m[0]}
  else if(e.key==="l"&&e.ctrlKey){e.preventDefault();log.innerHTML=""}
});
$("#chips").innerHTML=names.map(n=>`<button type="button">${esc(n)}</button>`).join("");
$("#chips").addEventListener("click",e=>{if(e.target.tagName==="BUTTON"){run(e.target.textContent);inp.focus({preventScroll:true})}});
term.addEventListener("click",()=>{if(!getSelection().toString())inp.focus({preventScroll:true})});
log.innerHTML=`<div class="out"><p><span class="ac" style="font-size:1.25em;font-weight:700">${esc(CONFIG.name)}</span></p><p>${esc(CONFIG.tagline)}</p><p class="dim">Type <span class="ac">help</span> or tap a command below to explore.</p></div>`;
</script>
</body>
</html>
